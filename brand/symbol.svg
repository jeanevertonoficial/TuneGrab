<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 400">
  <!-- Símbolo do TuneGrab (redesenhado em vetor a partir de brand/logo-original.webp):
       play arredondado + nota musical + seta de download. Medidas tiradas dos pixels do original. -->
  <polygon points="60,65 60,290 260,190" fill="#0AED7C" stroke="#0AED7C" stroke-width="72" stroke-linejoin="round"/>
  <!-- contorno verde da seta (aparece onde ela sai do play) -->
  <path d="M150 214 H204 V285 H234 L177 343 L120 285 H150 Z" fill="#0AED7C" stroke="#0AED7C" stroke-width="52" stroke-linejoin="round"/>
  <!-- nota -->
  <g fill="#000">
    <circle cx="103" cy="226" r="39"/>
    <rect x="122" y="103" width="21" height="124"/>
    <path d="M122 103 L193 147 V177 L143 148 Z"/>
  </g>
  <!-- seta -->
  <path d="M150 214 H204 V285 H234 L177 343 L120 285 H150 Z" fill="#000"/>
</svg>
